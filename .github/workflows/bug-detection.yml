          fi
          
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          ---
          **Legend:** 🔴 Critical | 🟡 Medium | ✅ No Issue | ⚪ Not Tested
          
          *Tests fail when bugs are detected. Fix the bugs to make tests pass.*
          EOF

      - name: Job Results
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "           FINAL BUG DETECTION RESULTS"
